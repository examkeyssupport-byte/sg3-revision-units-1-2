<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smo's Revision · SG3 Units 1 &amp; 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<style>
/* Interactive copy of the two SG3 revision sheets (U1 Lifestyle, U2 Life stories): same sections, same order, same questions.
   Built for a weak student: every question is marked the moment she answers, she can try again, and the reason
   appears in Arabic. Extra: Arabic help per section, listen buttons, Real Talk flip cards, stars and a finish screen. */
:root{--navy:#0b2a6b;--red:#e3000f;--green:#0f9d4f;--orange:#f07d1a;--teal:#2aa7c9;--ink:#1c1c1c;--ok:#12854a;--okbg:#d9f7e4;--bad:#c8001a;--badbg:#ffe0e3;--ans:#1a3fd0;--gold:#ffb703}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:18px/1.5 Arial,"Segoe UI",system-ui,sans-serif;
  background:radial-gradient(circle at 12% 8%,#ffe9c7 0,transparent 30%),radial-gradient(circle at 90% 20%,#cfeefa 0,transparent 32%),radial-gradient(circle at 50% 100%,#e5dcff 0,transparent 40%),#f4f7ff;background-attachment:fixed}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.script{font-family:Pacifico,"Segoe Script","Brush Script MT",cursive;font-weight:400}
/* sticky bar: unit tabs, stars, progress */
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:8px 12px 10px;box-shadow:0 4px 14px rgba(11,42,107,.3)}
.bar .row{max-width:900px;margin:0 auto;display:flex;gap:8px;align-items:center}
.tab{flex:1;border:2px solid #fff;background:transparent;color:#fff;font-weight:700;border-radius:999px;padding:6px 8px;min-height:44px;line-height:1.15;font-size:.9rem}
.tab.on{background:#fff;color:var(--navy)}
.tab small{display:block;font-weight:400;font-size:.75rem;opacity:.9}
.stars{font-weight:800;white-space:nowrap;font-size:1.05rem;min-width:84px;text-align:right}
.stars.pop{animation:pop .45s}
.prog{max-width:900px;margin:8px auto 0;height:10px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#ff7b54);border-radius:99px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.sheet{max-width:900px;margin:0 auto;padding:14px 12px 40px}
.hero{text-align:center;margin:6px 0 16px}
.hero .hi{display:inline-block;background:#fff;border:2px dashed var(--orange);color:var(--orange);border-radius:999px;padding:2px 16px;font-weight:700;margin-bottom:4px}
.hero h1{margin:0;font-size:2.1rem;line-height:1.35;color:var(--navy)}
.hero h1 b{color:var(--teal);font-weight:400}
.hero p{margin:4px 0 0;font:1rem/1.7 "Segoe UI",Tahoma,Arial,sans-serif;color:#40507a}
/* one rounded box per part of the paper, with the orange side label */
.grp{position:relative;background:#fff;border:3px solid var(--navy);border-radius:30px;padding:18px 62px 8px 18px;margin:0 0 20px;box-shadow:0 8px 0 rgba(11,42,107,.12);animation:rise .5s both}
.tag{position:absolute;right:10px;top:26px;width:40px;border:2.5px solid var(--navy);border-radius:14px;background:#fff;display:flex;justify-content:center;padding:14px 0}
.tag span{writing-mode:vertical-rl;font-family:Pacifico,"Segoe Script","Brush Script MT",cursive;color:var(--orange);font-size:1.25rem;line-height:1}
.sec{margin:0 0 18px}
.sec h3{margin:0 0 6px;color:var(--red);font-size:1.12rem}
.sec h4{margin:10px 0 4px;color:var(--green);font-size:1.05rem}
.hint{border:1.5px dashed #e0a100;border-radius:12px;background:#fff8e1;margin:0 0 10px}
.hint summary{cursor:pointer;font-weight:700;padding:8px 12px;min-height:40px;color:#7a5600;list-style:none}
.hint summary::-webkit-details-marker{display:none}
.hint div{padding:0 12px 10px;font:1.02rem/1.85 "Segoe UI",Tahoma,Arial,sans-serif;color:#3b2c00}
.hint b,.why b{color:var(--navy);font-family:Arial,sans-serif;unicode-bidi:isolate;direction:ltr;display:inline-block}
.it{margin:0 0 6px;padding:7px 8px;border-radius:12px;transition:background .3s}
.it.solved{background:#f3fff7}
.ln{line-height:2.1}
.n{font-weight:700}
.pk{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle;margin:2px 4px}
.o{border:2px solid var(--teal);background:#fff;color:#0a5a73;border-radius:999px;padding:3px 14px;min-height:40px;font-weight:700;transition:transform .12s}
.o:active{transform:scale(.94)}
.o:disabled{opacity:.4;cursor:default}
.o.ok{opacity:1!important;transform:scale(1.06)}
.o.bad{text-decoration:line-through}
.ok{background:var(--okbg)!important;border-color:var(--ok)!important;color:#0b5c2e!important}
.bad{background:var(--badbg)!important;border-color:var(--bad)!important;color:#8f0012!important}
.gp{font-style:normal;font-weight:700;letter-spacing:1px}
.gp.fill{color:var(--ok);text-decoration:underline}
.in{color:var(--ans);font-weight:700;border:2px solid #9bb7d6;border-radius:10px;background:#f4f9ff;padding:4px 8px;width:150px;max-width:100%;min-height:42px;text-align:center}
.in.long{width:100%;text-align:left;flex:1}
.in.one{width:46px;padding:4px 2px;font-size:1.15rem}
.ans{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.go{border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;min-width:46px;min-height:42px;font-size:1.1rem}
.mini{border:1.5px solid var(--navy);background:#eef3ff;color:var(--navy);border-radius:10px;padding:4px 10px;min-height:38px;font-weight:700;font-size:.9rem}
.why{display:flex;gap:8px;align-items:flex-start;color:#3b2c00;background:#fff8e1;border-radius:10px;padding:6px 10px;margin:6px 0 0;font:1rem/1.75 "Segoe UI",Tahoma,Arial,sans-serif;text-align:right;animation:rise .35s both}
.why .mini{flex:none}
.why p{margin:0;flex:1}
.why em{font-style:normal;font-weight:800;color:var(--ok);direction:ltr;display:block;text-align:right;font-family:Arial,sans-serif}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chip{border:2px solid var(--green);background:#fff;color:var(--green);border-radius:999px;padding:4px 14px;min-height:40px;font-weight:700}
.chip.used{opacity:.3;text-decoration:line-through}
.chip.sm{color:var(--ink);border-color:#9bb7d6;border-width:1.5px}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.pics.two{grid-template-columns:repeat(2,1fr);max-width:420px}
.pic{border:2px solid #dbe5f5;border-radius:16px;padding:8px 6px;text-align:center;background:#fff;min-width:0}
.pic.solved{border-color:var(--ok);background:#f3fff7}
.pic img{width:100%;height:104px;object-fit:contain;display:block;margin-bottom:6px}
.pic .in{width:100%}
.pic .ans{justify-content:center}
.pic .why{font-size:.9rem;padding:4px 6px;flex-direction:column-reverse;align-items:center;text-align:center;gap:2px}
.pic .why em{text-align:center}
.pic .in.one{width:46px;margin:0 3px}
.word{font-size:1.2rem;font-weight:700;margin-bottom:2px}
table.mt{border-collapse:collapse;width:100%}
.mt td{border:1.5px solid #555;padding:5px 8px;vertical-align:middle}
.mt td.k{width:36px;text-align:center;font-weight:700;background:#eee}
.mt td.b{width:62px;text-align:center;padding:4px}
.mt td.w{font-weight:700}
.mt td.wr{border:0;padding:0 0 6px}
.mt td.wr:empty{display:none}
.mt td.wr .why{margin-top:2px}
/* Real Talk flip cards */
.talk{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 0 12px}
.card{perspective:800px;border:0;background:none;padding:0;min-height:128px;text-align:center}
.card .inner{position:relative;display:block;width:100%;height:100%;min-height:128px;transition:transform .55s;transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.card .f,.card .k2{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.card .f{background:linear-gradient(135deg,#0b6fc2,#0b2a6b);color:#fff;font-weight:800;font-size:1.15rem}
.card .f small{font-weight:400;font-size:.75rem;opacity:.85;margin-top:6px}
.card .k2{background:#f5e9c8;color:#2b2b2b;transform:rotateY(180deg);font-size:.98rem;line-height:1.35}
.card .k2 span{font:700 1.05rem/1.6 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--navy);margin-top:4px}
/* part tabs (Worksheet / Spelling / More practice) */
.bar .parts{margin-top:8px;gap:6px}
.ptab{flex:1;border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:700;border-radius:10px;padding:4px 4px;min-height:40px;font-size:.85rem;line-height:1.15}
.ptab.on{background:var(--gold);color:#3a2a00}
.note{margin:0 0 12px;background:#eef6ff;border-radius:12px;padding:8px 12px;font:1rem/1.8 "Segoe UI",Tahoma,Arial,sans-serif;color:#23365f;text-align:right}
/* spelling cards: meaning + listen + look-cover-write */
.spells{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sp{border:2px solid #dbe5f5;border-radius:16px;padding:10px;background:#fff;min-width:0}
.sp.solved{border-color:var(--ok);background:#f3fff7}
.sp .ar{font:700 1.15rem/1.6 "Segoe UI",Tahoma,Arial,sans-serif;color:var(--navy);text-align:center}
.sp .peek{text-align:center;font-weight:800;font-size:1.5rem;letter-spacing:3px;color:var(--ok);background:var(--okbg);border-radius:10px;padding:2px 6px;margin-top:4px;animation:pop .3s}
.sp .tl{display:flex;gap:6px;justify-content:center;margin-top:6px}
.sp .in{letter-spacing:1px}
.end{text-align:center;margin:8px 0 0}
.big{font-weight:700;border:0;border-radius:14px;padding:10px 20px;background:var(--navy);color:#fff;min-height:48px}
.big.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
/* finish screen */
.fin{position:fixed;inset:0;z-index:20;background:rgba(11,42,107,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.fin canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cert{position:relative;background:#fff;border:6px double var(--gold);border-radius:26px;padding:22px 20px;max-width:440px;width:100%;text-align:center;animation:pop .6s}
.cert .cup{font-size:3.4rem;line-height:1}
.cert h2{margin:6px 0 2px;color:var(--navy);font-size:1.9rem;line-height:1.4}
.cert p{margin:4px 0}
.cert .num{white-space:pre-line;line-height:1.5;font-size:1.5rem;font-weight:800;color:var(--orange)}
.cert .ar{font:1.1rem/1.8 "Segoe UI",Tahoma,Arial,sans-serif;color:#40507a}
.cert .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  body{font-size:17px}
  .sheet{padding:12px 8px 30px}
  .hero h1{font-size:1.6rem}
  .grp{padding:44px 10px 4px;border-radius:22px}
  .tag{right:auto;left:50%;top:-3px;transform:translateX(-50%);width:auto;padding:2px 22px 6px;border-top:0;border-radius:0 0 16px 16px}
  .tag span{writing-mode:horizontal-tb}
  .pics{grid-template-columns:repeat(2,1fr)}
  .spells{grid-template-columns:1fr}
  .ptab{font-size:.78rem}
  .it{padding:6px 4px}
  .mt td{padding:4px 5px;font-size:.92rem}
  .mt td.b{width:54px}
  .stars{min-width:70px;font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.bar,.fin,.hint,.end{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="bar">
  <div class="row">
    <button class="tab" id="t0" type="button">Unit 1<small>Lifestyle</small></button>
    <button class="tab" id="t1" type="button">Unit 2<small>Life stories</small></button>
    <div class="stars" id="stars" aria-live="polite"></div>
  </div>
  <div class="row parts" id="parts"></div>
  <div class="prog"><i id="prog"></i></div>
</div>
<main class="sheet">
  <div class="hero">
    <div class="hi">SG3 · Revision</div>
    <h1 class="script">Smo's <b id="ttl"></b></h1>
    <p dir="rtl">أجيبي على كل سؤال، وسيظهر لكِ فورًا هل هو صحيح مع الشرح. إذا أخطأتِ حاولي مرة ثانية 💪</p>
  </div>
  <div id="pages"></div>
  <div class="end"><button class="big alt" id="again" type="button">↺ Start this part again</button></div>
</main>
<div class="fin" id="fin" hidden>
  <canvas id="cv"></canvas>
  <div class="cert" role="dialog" aria-modal="true" aria-labelledby="fh">
    <div class="cup">🏆</div>
    <h2 class="script" id="fh">Well done, Smo!</h2>
    <p id="fu"></p>
    <p class="num" id="fn"></p>
    <p class="ar" dir="rtl" id="fa"></p>
    <div class="btns"><button class="big" id="fnext" type="button"></button><button class="big alt" id="fclose" type="button">Look at my answers</button></div>
  </div>
</div>

    hint:"<b>blood</b> = دم · <b>encouraged</b> = شجّع · <b>compete</b> = يتنافس · <b>appointment</b> = موعد",
    items:[
     {n:1, t:"People give {} to help sick people in the hospital.", o:["litter","blood","league"], a:1, why:"<b>give blood</b> = يتبرع بالدم."},
     {n:2, t:"My teacher {} me to study hard, so I passed.", o:["encouraged","competed","received"], a:0, why:"<b>encouraged</b> = شجّعني."},
     {n:3, t:"Ten teams {} in the football league.", o:["donate","receive","compete"], a:2, why:"<b>compete</b> = يتنافس. الفرق تتنافس في الدوري."},
     {n:4, t:"I have an {} with the doctor at 5 o'clock.", o:["appointment","attitude","owner"], a:0, why:"<b>appointment</b> = موعد."}]}
  ]}
 ]}
];
const PARTS = [["groups","📄 Worksheet"],["spell","🔤 Spelling"],["more","💪 More practice"]];
const PAGES = UNITS.flatMap((U,u) => PARTS.map(([k,label]) => ({u, label, groups:U[k]})));

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; };
const btn = (cls, html, fn) => { const b = el("button", cls, html); b.type = "button"; b.onclick = fn; return b; };
// typed answers: capitals, extra spaces, punctuation, hyphens and curly/straight apostrophes do not matter
const norm = x => String(x ?? "").toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:–-]/g," ").replace(/\s+/g," ").trim();
const plain = h => el("div",null,h).textContent;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canSay = "speechSynthesis" in window;
function say(text){ if(!canSay) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .8; speechSynthesis.speak(u); }
// small sounds, only ever started by a tap
let AC = null;
function tone(freqs, type, len){ try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume();
  freqs.forEach((f,k) => { const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + k*len*.8; o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.14,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t+len+.02); }); }catch(e){} }
const ding = () => tone([660,880],"sine",.16), buzz = () => tone([170],"triangle",.22), fanfare = () => tone([523,659,784,1047],"sine",.2);
const PRAISE = ["Great!","Excellent!","Well done!","Perfect!","Super!","Bravo!"];

/* ---------- one unit; every question is a Q {tries, solved} that calls win() once ---------- */
let cur = 0; const ST = PAGES.map(() => null);
function win(st, Q, host, why, full){
  if(Q.solved) return; Q.solved = true; st.solved++; if(Q.tries===0) st.first++;
  host.classList.add("solved");
  const w = el("div","why"); w.dir = "rtl";
  if(full && canSay){ const b = btn("mini","🔊",()=>say(full)); b.setAttribute("aria-label","Listen"); w.append(b); }
  w.append(el("p",null,"<em>"+(Q.tries===0 ? "🌟 "+PRAISE[st.solved%PRAISE.length] : "✅ Now you know!")+"</em>"+(why||"")));
  host.append(w); ding(); refresh(true);
}
function miss(Q, node){ Q.tries++; node.classList.remove("shake"); void node.offsetWidth; node.classList.add("shake"); buzz(); }

function build(ui){
  const U = PAGES[ui], root = $("pg"+ui), st = ST[ui] = {total:0, solved:0, first:0, shown:false}; root.innerHTML = "";
  // typed answer with its own ✓ button; after two wrong tries a "Show me" button appears
  const typed = (host, alts, why, full, cls, auto, noShow) => {
    const Q = {tries:0, solved:false}; st.total++;
    const i = el("input","in"+(cls?" "+cls:"")); i.type = "text"; i.autocomplete = "off"; i.autocapitalize = "off"; i.spellcheck = false; i.setAttribute("autocorrect","off");
    const done = () => { i.classList.remove("bad"); i.classList.add("ok"); i.readOnly = true; go.hidden = true; show.hidden = true; win(st,Q,host,why,full); };
    const check = () => { if(Q.solved) return; if(!i.value.trim()){ i.focus(); return; }
      if(alts.some(a=>norm(a)===norm(i.value))) done(); else { i.classList.add("bad"); miss(Q,i); if(Q.tries>=2 && !noShow) show.hidden = false; if(auto) setTimeout(()=>{ if(!Q.solved){ i.value = ""; i.classList.remove("bad"); } },700); } };
    const go = btn("go","✓",check); go.setAttribute("aria-label","Check");
    const show = btn("mini","👀 Show me",() => { i.value = alts[0]; Q.tries = Math.max(Q.tries,1); done(); }); show.hidden = true;
    i.onkeydown = e => { if(e.key==="Enter") check(); };
    i.oninput = () => { i.classList.remove("bad"); if(auto && i.value.trim()) check(); };
    if(auto) go.hidden = true;
    return {Q,i,go,show,check};
  };

  U.groups.forEach(g => {
    const card = el("section","grp"); card.append(el("div","tag","<span>"+g.label+"</span>"));
    g.secs.forEach(s => {
      const sec = el("div","sec");
      if(s.h) sec.append(el("h3",null,s.h)); if(s.sub) sec.append(el("h4",null,s.sub));
      if(s.note){ const p = el("p","note",s.note); p.dir = "rtl"; sec.prepend(p); }
      if(s.hint){ const d = el("details","hint"); d.append(el("summary",null,"💡 مساعدة · Help")); const b = el("div",null,s.hint); b.dir = "rtl"; d.append(b); sec.append(d); }

      if(s.type==="pick"){
        s.items.forEach(it => { const Q = {tries:0, solved:false}; st.total++;
          const d = el("div","it"), ln = el("div","ln"), parts = it.t.split("{}"), grp = el("span","pk");
          ln.append(el("span","n",it.n+"- ")); ln.insertAdjacentHTML("beforeend", parts[0]);
          const full = it.full || plain(parts[0] + (it.cap ? it.o[it.a][0].toUpperCase()+it.o[it.a].slice(1) : it.o[it.a]) + (parts[1]||""));
          it.o.forEach((t,k) => { const b = btn("o", t, () => { if(Q.solved) return;
            if(k===it.a){ b.classList.add("ok"); grp.querySelectorAll(".o").forEach(x=>{ if(x!==b) x.disabled = true; });
              const gp = ln.querySelector(".gp"); if(gp){ gp.textContent = t; gp.classList.add("fill"); } win(st,Q,d,it.why,full); }
            else { b.classList.add("bad"); b.disabled = true; miss(Q,b); } }); grp.append(b); });
          ln.append(grp); ln.insertAdjacentHTML("beforeend", parts[1]||""); d.append(ln); sec.append(d); });
      } else if(s.type==="fix"){
        s.items.forEach(it => { const d = el("div","it"); d.append(el("div","ln","<span class='n'>"+it.n+"- </span>"+it.t));
          const T = typed(d, it.a, it.why, it.a[1]), row = el("div","ans"); T.i.placeholder = "correct word"; T.i.setAttribute("aria-label","correct word for sentence "+it.n);
          row.append(T.i, T.go, T.show); d.append(row); sec.append(d); });
      } else if(s.type==="order"){
        s.items.forEach(it => { const d = el("div","it"); d.append(el("div","ln","<span class='n'>"+it.n+"- </span>"+it.w.join(" \\ ")));
          const T = typed(d, it.a, it.why, it.a[0], "long"), row = el("div","bank"); row.style.margin = "6px 0 0"; T.i.setAttribute("aria-label","sentence "+it.n);
          const cs = it.w.map(w => btn("chip sm", w, e => { if(T.Q.solved) return; const punct = /^[?.]$/.test(w); T.i.value = (T.i.value + (punct ? "" : " ") + w).trim(); e.currentTarget.classList.add("used"); e.currentTarget.disabled = true;
            T.i.classList.remove("bad"); if(cs.every(c=>c.disabled)) T.check(); }));
          const clr = btn("chip sm","⌫ Clear", () => { if(T.Q.solved) return; T.i.value = ""; T.i.classList.remove("bad"); cs.forEach(c=>{ c.classList.remove("used"); c.disabled = false; }); });
          row.append(...cs, clr); const a = el("div","ans"); a.append(T.i, T.go, T.show); d.append(row, a); sec.append(d); });
      } else if(s.type==="pics"){
        const bank = el("div","bank"), Ts = []; let focus = null;
        const g2 = el("div","pics");
        s.items.forEach((it,k) => { const c = el("div","pic"), im = el("img"); im.src = IMG[it.img]; im.alt = "picture "+(k+1);
          const T = typed(c, it.a, it.why, it.a[0]), row = el("div","ans"); T.i.setAttribute("aria-label","word for picture "+(k+1)); T.i.onfocus = () => { focus = T; };
          row.append(T.i, T.go, T.show); c.append(im, row); g2.append(c); Ts.push(T); });
        s.bank.forEach(w => { const b = btn("chip", w, () => { if(b.classList.contains("used")) return; const T = (focus && !focus.Q.solved && !focus.i.value) ? focus : Ts.find(t=>!t.Q.solved && !t.i.value) || Ts.find(t=>!t.Q.solved); if(!T) return;
          T.i.value = w; T.i.classList.remove("bad"); focus = null; T.check(); mark(); }); b.dataset.w = w; bank.append(b); });
        const mark = () => bank.querySelectorAll(".chip").forEach(b => b.classList.toggle("used", Ts.some(t=>t.Q.solved && norm(t.i.value)===norm(b.dataset.w))));
        g2.addEventListener("keyup", mark); g2.addEventListener("click", () => setTimeout(mark,0));
        sec.append(bank, g2);
      } else if(s.type==="gap"){
        const g2 = el("div","pics two");
        s.items.forEach((it,k) => { const c = el("div","pic"), im = el("img"); im.src = IMG[it.img]; im.alt = "picture "+(k+1);
          const T = typed(c, [it.a], it.why, it.full, "one", true); T.i.maxLength = 1; T.i.setAttribute("aria-label","missing letter in picture "+(k+1));
          const w = el("div","word"); w.append(it.pre, T.i, it.post); const row = el("div","ans"); row.append(T.show); c.append(im, w, row); g2.append(c); });
        sec.append(g2);
      } else if(s.type==="match"){
        const tb = el("table","mt");
        s.right.forEach((r,k) => { const tr = el("tr"), cellR = el("td",null,r.t), b = el("td","b"), wr = el("td","wr"), tr2 = el("tr"); wr.colSpan = 4; tr2.append(wr);
          const T = typed(wr, [r.a], r.why, s.left[r.a-1]+". "+r.t, "one", true); T.i.maxLength = 1; T.i.inputMode = "numeric"; T.i.setAttribute("aria-label","number for: "+r.t);
          b.append(T.i); tr.append(el("td","k",k+1), el("td","w",s.left[k]), b, cellR); cellR.append(" ", T.show); tb.append(tr, tr2); });
        sec.append(tb);
      } else if(s.type==="spell"){
        // look-cover-write: the word is never filled in for her; "Look" shows it for 3 seconds, then she writes it from memory
        const g2 = el("div","spells");
        s.items.forEach(it => { const c = el("div","sp"), a = el("div","ar",it.ar), peek = el("div","peek",it.w), tl = el("div","tl"), row = el("div","ans"); a.dir = "rtl"; peek.hidden = true; let tm = 0;
          const T = typed(c, [it.w].concat(it.alts||[]), "<b>"+it.w+"</b> = "+it.ar, it.w, "long", false, true); T.i.setAttribute("aria-label","spell the word that means "+it.ar);
          T.i.placeholder = [...it.w].map((ch,k) => k===0 ? ch : /[a-z]/i.test(ch) ? "_" : ch).join(" ");
          const hide = () => { clearTimeout(tm); peek.hidden = true; };
          if(canSay) tl.append(btn("mini","🔊 Listen",() => say(it.w)));
          tl.append(btn("mini","👁 Look",() => { if(T.Q.solved) return; peek.hidden = false; clearTimeout(tm); tm = setTimeout(() => { hide(); T.i.focus(); }, 3000); }));
          T.i.addEventListener("input", hide); T.go.addEventListener("click", hide);
          row.append(T.i, T.go); c.append(a, peek, tl, row); g2.append(c); });
        sec.append(g2);
      } else if(s.type==="talk"){
        const g2 = el("div","talk");
        s.cards.forEach(c => { const b = btn("card", "<span class='inner'><span class='f'>"+c.w+"<small>tap 👆</small></span><span class='k2'>"+c.m+"<span dir='rtl'>"+c.ar+"</span></span></span>",
          () => { b.classList.toggle("flip"); if(b.classList.contains("flip")) say(c.w.replace(/[()…?]/g,"")); }); g2.append(b); });
        sec.append(g2);
      }
      card.append(sec);
    });
    root.append(card);
  });
}

/* ---------- page ---------- */
function refresh(pop){
  const st = ST[cur]; $("stars").textContent = "⭐ "+st.solved+" / "+st.total; $("prog").style.width = (st.solved/st.total*100)+"%";
  if(pop){ $("stars").classList.remove("pop"); void $("stars").offsetWidth; $("stars").classList.add("pop"); }
  const full = i => ST[i].solved===ST[i].total, u = PAGES[cur].u;
  [0,1].forEach(k => { $("t"+k).firstChild.textContent = ([0,1,2].every(p=>full(k*3+p)) ? "✔ " : "")+"Unit "+(k+1); });
  [0,1,2].forEach(p => { $("pt"+p).textContent = (full(u*3+p) ? "✔ " : "")+PARTS[p][1]; });
  if(st.solved===st.total && !st.shown){ st.shown = true; setTimeout(finish, 900); }
}
function tab(i){ cur = i; if(canSay) speechSynthesis.cancel(); const u = PAGES[i].u;
  PAGES.forEach((_,k) => { $("pg"+k).hidden = k!==i; });
  [0,1].forEach(k => { $("t"+k).className = "tab"+(k===u?" on":""); });
  [0,1,2].forEach(p => { $("pt"+p).className = "ptab"+(u*3+p===i?" on":""); });
  $("ttl").textContent = UNITS[u].ttl; refresh(); }
let raf = 0;
function finish(){
  const st = ST[cur], P = PAGES[cur];
  let next = -1; for(let k=1;k<PAGES.length;k++){ const j = (cur+k)%PAGES.length; if(ST[j].solved<ST[j].total){ next = j; break; } }
  $("fu").textContent = "You finished "+UNITS[P.u].name+" · "+P.label.replace(/^\S+ /,"");
  $("fn").textContent = "⭐ "+st.solved+" / "+st.total+"\n🌟 First try: "+st.first;
  $("fa").textContent = st.first===st.total ? "ممتازة! كل الإجابات صحيحة من أول مرة 👏" : st.first>=st.total*.7 ? "أحسنتِ! أعيدي الوحدة مرة ثانية لتصير كلها من أول مرة." : "عمل جميل! افتحي 💡 المساعدة وأعيدي الوحدة، وستكونين أفضل في كل مرة.";
  $("fnext").textContent = next<0 ? "↺ Do it again" : "Next: "+(PAGES[next].u!==P.u ? "Unit "+(PAGES[next].u+1)+" " : "")+PAGES[next].label.replace(/^\S+ /,"")+" →";
  $("fnext").onclick = () => { closeFin(); if(next<0) build(cur); tab(next<0 ? cur : next); scrollTo(0,0); };
  $("fin").hidden = false; fanfare(); $("fnext").focus(); if(!calm) confetti();
}
function closeFin(){ $("fin").hidden = true; cancelAnimationFrame(raf); }
function confetti(){
  const cv = $("cv"), c = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#ffb703","#f07d1a","#2aa7c9","#0f9d4f","#e3000f","#ffffff"], ps = Array.from({length:140}, () => ({x:Math.random()*cv.width, y:-Math.random()*cv.height, r:5+Math.random()*7, v:2+Math.random()*4, s:Math.random()*6, c:cols[Math.random()*cols.length|0]}));
  const t0 = performance.now();
  (function step(t){ c.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p => { p.y += p.v; p.s += .08; p.x += Math.sin(p.s)*1.6; if(p.y>cv.height+10 && t-t0<6000) p.y = -10; c.fillStyle = p.c; c.save(); c.translate(p.x,p.y); c.rotate(p.s); c.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); c.restore(); });
    if(t-t0<9000) raf = requestAnimationFrame(step); else c.clearRect(0,0,cv.width,cv.height); })(t0);
}
$("fclose").onclick = closeFin;
$("fin").onclick = e => { if(e.target===$("fin")) closeFin(); };
addEventListener("keydown", e => { if(e.key==="Escape" && !$("fin").hidden) closeFin(); });
$("t0").onclick = () => { tab(0); scrollTo(0,0); };
$("t1").onclick = () => { tab(3); scrollTo(0,0); };
PARTS.forEach((_,p) => { const b = btn("ptab","",() => { tab(PAGES[cur].u*3+p); scrollTo(0,0); }); b.id = "pt"+p; $("parts").append(b); });
PAGES.forEach((_,k) => { const d = el("div"); d.id = "pg"+k; $("pages").append(d); build(k); });
$("again").onclick = () => { build(cur); tab(cur); scrollTo(0,0); };
tab(0);
</script>
</body>
</html>
